name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python3 -m unittest discover -s tests -v
      - name: Reproduce candidate backtest evidence
        run: |
          backtest_exit=0
          cargo run --locked -p aegis-sim -- --backtest evaluations/manifest.json > "$RUNNER_TEMP/backtest-results.json" || backtest_exit=$?
          test "$backtest_exit" -eq 2
          diff -u evaluations/results.json "$RUNNER_TEMP/backtest-results.json"
  solidity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.8.6
      - run: forge fmt --check
      - run: forge build
      - run: forge test
      - run: python3 scripts/e2e-node.py
      - run: python3 scripts/e2e-bucket.py
      - run: python3 -m unittest discover -s tests -p e2e_sentinel.py -v
      - run: python3 -m unittest discover -s tests -p e2e_pricing.py -v
